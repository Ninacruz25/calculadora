<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Visualizador 3D - FastAPI & Three.js</title>
    <link rel="stylesheet" href="/static/viewer.css">
    <!-- three.js r128 (MIT) servido localmente: sin CDN de terceros, sin SRI que mantener -->
    <script src="/static/three.min.js"></script>
</head>

<body>

    <div id="info">
        <h3>Visualizador 3D (FastAPI + WebSocket)</h3>
        <p>
            Figura:
            <select id="figura">
                <option value="esfera">Esfera</option>
                <option value="cubo">Cubo</option>
                <option value="toroide">Toroide (CSV)</option>
                <option value="morph">Dona → Taza</option>
            </select>
        </p>
        <div id="morph-controles" hidden>
            <p>
                <label for="morph-t">Dona</label>
                <input type="range" id="morph-t" min="0" max="1" step="0.01" value="0">
                <label for="morph-t">Taza</label>
                <strong id="morph-valor">0%</strong>
            </p>
            <p>
                <input type="text" id="figura-nombre" maxlength="60" placeholder="Nombre de la figura">
                <button type="button" id="figura-guardar">Guardar</button>
            </p>
            <p>Figura: <strong id="figura-etiqueta">Dona</strong></p>
        </div>
        <p>Estado WebSocket: <span id="ws-status">Conectando...</span></p>
        <p>Puntos cargados: <strong id="point-count">0</strong></p>
    </div>

    <script src="/static/viewer.js"></script>
</body>

</html>
